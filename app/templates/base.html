<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Message Intelligence Demo</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --text:#e7e9ee; --muted:#9aa3b2; --accent:#6ea8fe; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  header { padding: 18px 28px; border-bottom: 1px solid var(--line); display:flex; gap:24px; align-items:center; }
  header a { color: var(--muted); text-decoration:none; font-size: 14px; }
  header a.active, header a:hover { color: var(--accent); }
  h1 { font-size: 18px; margin:0; margin-right: 12px;}
  main { padding: 24px 28px; max-width: 1100px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap:12px; margin-bottom: 24px; }
  .stat { background: var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .stat .num { font-size: 26px; font-weight:700; }
  .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em;}
  table { width:100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align:left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight:600; font-size: 11px; text-transform: uppercase; }
  .pill { display:inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight:600; }
  .cat-action_required{background:#3a2e12;color:#f5c26b}
  .cat-meeting_or_event{background:#122a3a;color:#6ea8fe}
  .cat-personal_information{background:#2a123a;color:#c98bf0}
  .cat-general_information{background:#1c2230;color:#9aa3b2}
  .cat-promotional{background:#12351f;color:#5fd88a}
  .cat-sensitive_information{background:#3a1212;color:#f77}
  .risk-high{color:#ff6b6b;font-weight:700}
  .risk-medium{color:#f5c26b;font-weight:700}
  select { background: var(--card); color: var(--text); border:1px solid var(--line); padding:6px 10px; border-radius:6px; margin-bottom: 14px;}
  .muted { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Message Intelligence Demo</h1>
  <a href="/">Overview</a>
  <a href="/messages">Classification</a>
  <a href="/tasks-events">Tasks &amp; Events</a>
  <a href="/sensitive">Sensitive Info</a>
  <a href="/mandatory">Mandatory IDs</a>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
